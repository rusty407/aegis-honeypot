# aegis-honeypot deployment config

[gateway]
bind_addr    = "0.0.0.0"
port         = 2222
max_sessions = 512                 # Global concurrent-session cap
max_sessions_per_ip = 8            # Concurrent-session cap per source IP (0 disables)
max_connects_per_min_per_ip = 20   # New connections per IP per rolling 60s window (0 disables)
host_key_path = "./host_key.pem"   # Persisted & auto-generated on first run. Remove to use an ephemeral key.

[vmm]
rootfs_path     = "./rootfs"          # Unused in Option A (fake shell)
overlay_base    = "./overlay"
memory_limit_mb = 256
cpu_quota_percent = 20

[forensics]
quarantine_dir  = "./quarantine"
sessions_dir    = "./sessions"
attacks_log     = "./attacks.json"
string_min_len  = 6

[logging]
level = "info"
json  = false

[dashboard]
bind_addr = "127.0.0.1"          # Loopback by default
port = 8080
require_auth = true              # Bearer token on every request. Only disable for local dev.
token_path = "./dashboard_token" # Persisted & auto-generated on first run, same as host_key_path above.

[geoip]
# Both optional and independent — see the README's GeoIP section for where
# to get free MaxMind databases. Omit either (or both) to disable that part
# of GeoIP tagging; nothing else about the honeypot depends on this.
# geoip_db_path = "./GeoLite2-City.mmdb"   # country, city, lat/lon
# asn_db_path   = "./GeoLite2-ASN.mmdb"    # network/ASN — a separate download
