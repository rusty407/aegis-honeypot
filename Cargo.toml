[workspace]
resolver = "2"
members = [
    "crates/aegis-common",
    "crates/aegis-gateway",
    "crates/aegis-vmm",
    "crates/aegis-collector",
    "crates/aegis-forensics",
    "crates/aegis-ebpf",
    "crates/aegis-dashboard",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["aegis-honeypot"]
license = "MIT"

[workspace.dependencies]
tokio              = { version = "1", features = ["full"] }
tokio-util         = { version = "0.7", features = ["codec", "io"] }
# russh 0.46 carried 12 published advisories (5 High, several pre-auth remote)
# on the single most exposed component in the system. 0.63 clears all of them.
russh              = "0.63"
# `russh-keys` no longer exists as a separate crate — it was folded into
# `russh::keys` at 0.50 and the standalone crate was abandoned at 0.50.0-beta.
#
# `rand` is a *direct* dependency only because russh 0.63 removed the
# `KeyPair::generate_ed25519()` helper; generating the persistent host key now
# needs an RNG passed in explicitly. It was already in the tree (russh depends
# on it), so this adds no new third-party code — only a direct declaration, and
# the version is pinned to match russh's so the two cannot diverge.
rand               = "0.10"
aya                = { version = "0.13", features = ["async_tokio"] }
aya-log            = "0.2"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "0.8"
thiserror          = "1"
anyhow             = "1"
uuid               = { version = "1", features = ["v4"] }
sha2               = "0.10"
hex                = "0.4"
regex              = "1"
chrono             = { version = "0.4", features = ["serde"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir            = "2"
bytes              = "1"
nix                = { version = "0.29", features = ["process","mount","sched","resource","signal","user","fs","term"] }
libc               = "0.2"
async-trait        = "0.1"
axum               = "0.7"
futures-util       = "0.3"
tokio-stream       = { version = "0.1", features = ["sync"] }
subtle             = "2"
maxminddb          = "0.31"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
