[workspace]
resolver = "2"
members = [
    "crates/aegis-common",
    "crates/aegis-gateway",
    "crates/aegis-vmm",
    "crates/aegis-collector",
    "crates/aegis-forensics",
    "crates/aegis-ebpf",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["aegis-honeypot"]
license = "MIT"

[workspace.dependencies]
tokio              = { version = "1", features = ["full"] }
tokio-util         = { version = "0.7", features = ["codec", "io"] }
russh              = "0.46"
russh-keys         = "0.46"
aya                = { version = "0.13", features = ["async_tokio"] }
aya-log            = "0.2"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "0.8"
thiserror          = "1"
anyhow             = "1"
uuid               = { version = "1", features = ["v4"] }
sha2               = "0.10"
hex                = "0.4"
regex              = "1"
chrono             = { version = "0.4", features = ["serde"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir            = "2"
bytes              = "1"
nix                = { version = "0.29", features = ["process","mount","sched","resource","signal","user","fs","term"] }
libc               = "0.2"
async-trait        = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
