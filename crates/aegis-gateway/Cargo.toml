[package]
name = "aegis-gateway"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
# Internal workspace crate — never published to crates.io.
publish = false

[[bin]]
name = "aegis-gateway"
path = "src/main.rs"

[dependencies]
aegis-common    = { path = "../aegis-common" }
aegis-collector = { path = "../aegis-collector" }
aegis-vmm       = { path = "../aegis-vmm" }
aegis-forensics = { path = "../aegis-forensics" }
aegis-ebpf      = { path = "../aegis-ebpf" }
tokio           = { workspace = true }
russh           = { workspace = true }
rand            = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
tracing         = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow          = { workspace = true }
chrono          = { workspace = true }
regex           = { workspace = true }
bytes           = { workspace = true }
sha2            = { workspace = true }
hex             = { workspace = true }
reqwest         = { version = "0.12", features = ["blocking"] }
uuid            = { workspace = true }
maxminddb       = { workspace = true }
